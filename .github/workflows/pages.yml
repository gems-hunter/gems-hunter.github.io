# Deploy website len GitHub Pages bang self-hosted runner.
# Can: Settings -> Pages -> Source = "GitHub Actions".
# Chi chay khi push vao main (hoac bam Run workflow), KHONG chay cho PR tu fork,
# de nguoi la khong chay duoc code tren may cua runner.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Kiem tra link hong, placeholder sot, thuong hieu... truoc khi deploy
      - name: Check site
        run: python3 scripts/check_site.py

      # Chi dua len nhung gi website dung; bo anh goc Instagram (~130 MB), scripts, data, i18n
      - name: Stage site
        run: |
          rm -rf _site && mkdir -p _site/assets
          cp -r index.html en san-pham robots.txt sitemap.xml .nojekyll _site/
          cp -r assets/css assets/js assets/img _site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
